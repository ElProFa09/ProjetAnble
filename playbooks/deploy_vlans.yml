---
- name: Déploiement automatisé des VLANs avec des boucles
  hosts: routers
  gather_facts: no

  tasks:
    - name: Configurer les VLANs globaux sur le commutateur Cisco NX-OS (N9K)
      cisco.nxos.nxos_vlan:
        vlan_id: "{{ item.id }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ network_vlans }}"
      when: ansible_network_os == 'cisco.nxos.nxos'

    - name: Message d'information pour les routeurs (CAT8Kv et IOS-XRv)
      ansible.builtin.debug:
        msg: "Le routeur {{ inventory_hostname }} est un équipement de niveau 3, la base de VLANs globale de switch est ignorée."
      when: ansible_network_os != 'cisco.nxos.nxos'
